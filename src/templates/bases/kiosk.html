<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0d1a">
    <title>{% block title %}StewardWell Kiosk{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kiosk.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    <script>
        // Reset to idle after 60 seconds of inactivity
        (function () {
            var timeout;
            var IDLE_MS = 60000;
            var IDLE_URL = '/kiosk/';

            function resetTimer() {
                clearTimeout(timeout);
                timeout = setTimeout(function () {
                    if (window.location.pathname !== IDLE_URL) {
                        window.location.href = IDLE_URL;
                    }
                }, IDLE_MS);
            }

            ['touchstart', 'touchmove', 'click', 'keydown', 'mousemove'].forEach(function (evt) {
                document.addEventListener(evt, resetTimer, { passive: true });
            });

            resetTimer();
        })();
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
