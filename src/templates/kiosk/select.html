{% extends "bases/kiosk.html" %}

{% block title %}Who's here? – StewardWell Kiosk{% endblock %}

{% block body %}
<body class="select-body">

    <h1>Who's here? 👋</h1>

    <div class="select-children-grid">
        {% for child in children %}
        <a class="child-btn" href="{{ url_for('kiosk.pin', child_id=child.id) }}">
            <div class="select-avatar">{{ child.name[0].upper() }}</div>
            <div class="select-child-name">{{ child.name }}</div>
        </a>
        {% else %}
        <p style="color:var(--text-muted);font-size:1.3rem;">No children found.</p>
        {% endfor %}
    </div>

    <a class="btn btn-ghost select-back" href="{{ url_for('kiosk.idle') }}">← Back</a>

</body>
{% endblock %}
