{% extends "bases/kiosk.html" %}

{% block title %}Parent Access – StewardWell Kiosk{% endblock %}

{% block body %}
<body class="exit-body">

    <div class="exit-card">
        <span class="exit-lock-icon">🔒</span>
        <h2>Parent Access</h2>
        <p class="subtitle">Enter your password to exit kiosk mode.</p>

        {% if error %}
        <div class="exit-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('kiosk.exit_kiosk') }}">
            <div class="exit-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autofocus required>
            </div>
            <button type="submit" class="btn-exit">Exit Kiosk Mode</button>
        </form>

        <a class="exit-cancel" href="{{ url_for('kiosk.idle') }}">← Back to kiosk</a>
    </div>

</body>
{% endblock %}
